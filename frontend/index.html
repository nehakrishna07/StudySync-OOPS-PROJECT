<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   StudySync — Academic workspace
  </title>
  <link href="/css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div id="app">
   <div class="auth" id="auth">
    <div class="auth-card">
     <div class="brand">
      ✳
      <span>
       StudySync
      </span>
     </div>
     <p class="eyebrow">
      YOUR ACADEMIC WORKSPACE
     </p>
     <h1 id="auth-heading">
      Welcome back.
     </h1>
     <p class="sub">
      A quieter way to stay on top of your studies.
     </p>
     <form id="auth-form">
      <div hidden="" id="name-wrap">
       <label>
        Full name
        <input autocomplete="name" id="name"/>
       </label>
      </div>
      <label>
       Email
       <input autocomplete="email" id="email" placeholder="you@example.com" required="" type="email"/>
      </label>
      <label>
       Password
       <input id="password" minlength="8" placeholder="At least 8 characters" required="" type="password"/>
      </label>
      <p class="error" id="auth-error">
      </p>
      <button class="primary" id="auth-submit" type="submit">
       Sign in
      </button>
     </form>
     <button class="link" id="auth-switch">
      New here? Create an account
     </button>
    </div>
   </div>
   <div class="shell" hidden="" id="shell">
    <aside>
     <div class="brand">
      ✳
      <span>
       StudySync
      </span>
     </div>
     <div class="eyebrow nav-title">
      WORKSPACE
     </div>
     <nav id="nav">
      <button class="active" data-page="dashboard">
       ◫
       <span>
        Dashboard
       </span>
      </button>
      <button data-page="tasks">
       ☷
       <span>
        My Tasks
       </span>
      </button>
      <button data-page="schedule">
       ▦
       <span>
        Smart Schedule
       </span>
      </button>
      <button data-page="availability">
       ◷
       <span>
        Availability
       </span>
      </button>
      <button data-page="workload">
       ▥
       <span>
        Workload Analysis
       </span>
      </button>
      <button data-page="simulator">◇ <span>What-if Simulator</span></button>
      <button data-page="timer">◴ <span>Focus Timer</span></button>
      <button data-page="tracking">◷ <span>Time Tracking</span></button>
      <button data-page="reminders">
       ♧
       <span>
        Reminders
       </span>
      </button>
     </nav>
     <div class="sidebar-bottom">
      <button id="theme-toggle">
       ☾
       <span>
        Dark mode
       </span>
      </button>
      <button id="logout">
       ↪
       <span>
        Log out
       </span>
      </button>
      <div class="user">
       <span class="avatar" id="avatar">
        S
       </span>
       <span id="side-name">
        Student
       </span>
      </div>
     </div>
    </aside>
    <main>
     <header>
      <span class="eyebrow">
       STUDENT WORKSPACE /
       <span id="breadcrumb">
        OVERVIEW
       </span>
      </span>
      <div class="header-actions">
       <span id="today">
       </span>
       <button class="icon-btn" id="header-theme" title="Toggle theme">
        ☾
       </button>
       <span class="avatar" id="top-avatar">
        S
       </span>
      </div>
     </header>
     <div id="content">
     </div>
    </main>
   </div>
  </div>
  <script src="/js/app.js">
  </script>
  <script src="/js/calendar.js">
  </script>
  <script src="/js/pages.js">
  </script>
  <script src="/js/tasks.js">
  </script>
  <script src="/js/features.js"></script>
 </body>
</html>
